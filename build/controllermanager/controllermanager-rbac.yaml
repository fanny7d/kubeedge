---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller-manager
  namespace: kubeedge
  labels:
    k8s-app: kubeedge
    kubeedge: controller-manager

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: controller-manager
  labels:
    k8s-app: kubeedge
    kubeedge: controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: controller-manager
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: kubeedge

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-manager-leader-election
  namespace: kubeedge
  labels:
    k8s-app: kubeedge
    kubeedge: controller-manager
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-manager-leader-election
  namespace: kubeedge
  labels:
    k8s-app: kubeedge
    kubeedge: controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-manager-leader-election
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: kubeedge

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: controller-manager
  labels:
    k8s-app: kubeedge
    kubeedge: controller-manager
rules:
- apiGroups: ["apps.kubeedge.io"]
  resources: ["nodegroups", "nodegroups/status"]
  verbs: ["*"]
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["list", "watch", "patch", "get"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["list", "watch", "get", "delete"]
- apiGroups: ["apps.kubeedge.io"]
  resources: ["edgeapplications", "edgeapplications/status"]
  verbs: ["*"]
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["list", "watch", "create", "update", "patch", "delete", "get"]
- apiGroups: [""]
  resources: ["services"]
  verbs: ["list", "watch", "create", "update", "patch", "delete", "get"]
